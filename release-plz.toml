# release-plz configuration: https://release-plz.dev/docs/config

[workspace]
# Publish only when the release PR is merged, not on every push to main.
# This also avoids the race between squash merges and a running release.
release_always = false
pr_labels = ["release"]

[[package]]
# Development tasks (`cargo xtask`), never released nor published; `publish = false` must match
# `xtask/Cargo.toml` or `release-plz release` refuses to run.
name = "xtask"
release = false
publish = false

[changelog]
# Breaking changes stay in the changelog even if a parser below would skip them.
protect_breaking_commits = true
commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^fix", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^perf", group = "performance" },
    { message = "^docs", group = "documentation" },
    { message = "^chore\\(deps\\)", group = "dependencies" },
    # Not relevant to users of the crate (includes release-plz's own `chore: release` commits).
    { message = "^(ci|test|style|chore)", skip = true },
    { message = "^.*", group = "other" },
]
