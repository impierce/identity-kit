name: QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The PKCS#11 tests run against SoftHSM2 where it is a package install away, and skip
      # themselves elsewhere.
      - name: Set up SoftHSM2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s/softhsm/tokens\nobjectstore.backend = file\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          softhsm2-util --init-token --free --label identity-kit --so-pin 0102 --pin 1234
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so"
            echo "PKCS11_TOKEN_LABEL=identity-kit"
            echo "PKCS11_PIN=1234"
          } >> "$GITHUB_ENV"
      - run: cargo test --all-features --locked

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps --all-features --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Read the MSRV from `rust-version` in Cargo.toml so it is defined in one place.
      - id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "identity-kit") | .rust_version')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --all-features --locked

  # The lower layer builds on its own and pulls in none of the upper layer's dependencies.
  layers:
    name: Layer boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --no-default-features --features did-key,software --locked
      - run: |
          if cargo tree -e normal --no-default-features --features did-key,software --locked --prefix none | grep -E '^(chrono|miniz_oxide|sd-jwt-payload) '; then
            echo "::error::the lower layer pulls in a dependency of the upper layer"
            exit 1
          fi

  # Every feature compiles and lints on its own.
  features:
    name: Features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo install cargo-hack --locked
      - run: cargo hack clippy --each-feature --locked -- -D warnings

  # The crate packages and builds from the package, with no git or path dependencies.
  publish:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo publish --dry-run --locked

  # The public API against the pull request's base: a breaking change needs `!` in the title,
  # since the title decides the next version. Comparing against the base rather than the last
  # release keeps a breaking change already on `main` from failing every later pull request.
  semver:
    name: SemVer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `baseline-rev` builds the base commit from the local history.
          fetch-depth: 0
      - id: check
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        continue-on-error: true
        with:
          package: identity-kit
          feature-group: all-features
          baseline-rev: ${{ github.event.pull_request.base.sha }}
      - name: Breaking change declared in the title
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # The title as it is now, not as the event recorded it, so that re-running this job
        # after editing the title sees the edit.
        run: |
          title=$(gh api "repos/$REPO/pulls/$PR" --jq .title)
          if [[ "$title" =~ ^[a-z]+(\([^\)]*\))?!: ]]; then
            echo "::notice::Breaking change, declared in the title: $title"
          else
            echo "::error::cargo-semver-checks reports a breaking change (see the step above). Mark the title as breaking (\`feat!:\`, \`fix!:\`, ...), then re-run this job."
            exit 1
          fi

  # Single required check for branch protection.
  qa:
    name: QA
    if: always()
    needs: [fmt, clippy, test, docs, msrv, layers, features, publish, semver]
    runs-on: ubuntu-latest
    steps:
      # `semver` runs on pull requests only.
      - env:
          NEEDS: ${{ toJson(needs) }}
        run: echo "$NEEDS" | jq --exit-status 'to_entries | all(.value.result == "success" or (.key == "semver" and .value.result == "skipped"))'
