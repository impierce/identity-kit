name: Mutants

# Mutation testing with cargo-mutants: change the code (a return value, an operator, a match
# arm) and check that some test fails. A mutant no test catches is code the tests run but do not
# check. Informational: not part of QA, and missed mutants do not fail the job.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
  workflow_dispatch:
    inputs:
      files:
        description: "Files to mutate, as a glob such as src/jose/**; empty for the whole crate"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The PKCS#11 tests skip themselves without a SoftHSM2 token, so their mutants would all read as
  # missed here; run them locally with the PKCS11_* variables set.
  MUTANTS_EXCLUDE: src/keys/pkcs11.rs

jobs:
  # The mutants in the lines a pull request changes.
  in-diff:
    name: Mutants (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - run: cargo install cargo-mutants --locked
      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF...HEAD" > pr.diff
      - name: Test the mutants
        run: |
          status=0
          cargo mutants --in-diff pr.diff -j 2 --exclude "$MUTANTS_EXCLUDE" || status=$?
          # 2: missed mutants, 3: timeouts; both are findings, not errors.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
      - name: Annotate missed mutants
        if: always()
        run: |
          [ -s mutants.out/missed.txt ] || exit 0
          while IFS= read -r mutant; do
            file=${mutant%%:*}
            rest=${mutant#*:}
            echo "::warning file=$file,line=${rest%%:*},title=Missed mutant::${rest#*: }"
          done < mutants.out/missed.txt
          { echo "### Missed mutants"; echo; sed 's/^/- `/; s/$/`/' mutants.out/missed.txt; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-in-diff
          path: mutants.out
          if-no-files-found: ignore

  # Every mutant, or those in the given files, split across shards that run in parallel.
  full:
    name: Mutants (shard ${{ matrix.shard }}/8)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      SHARD: ${{ matrix.shard }}
      FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - run: cargo install cargo-mutants --locked
      - name: Test the mutants
        run: |
          status=0
          cargo mutants --shard "$SHARD/8" -j 2 --exclude "$MUTANTS_EXCLUDE" ${FILES:+-f "$FILES"} || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
      - if: always()
        run: |
          [ -s mutants.out/missed.txt ] || exit 0
          { echo "### Missed mutants, shard $SHARD"; echo; sed 's/^/- `/; s/$/`/' mutants.out/missed.txt; } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
