name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov upload via OIDC instead of a stored token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov
          fallback: none
      - name: Set up SoftHSM2
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s/softhsm/tokens\nobjectstore.backend = file\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          softhsm2-util --init-token --free --label identity-kit --so-pin 0102 --pin 1234
          {
            echo "SOFTHSM2_CONF=$SOFTHSM2_CONF"
            echo "PKCS11_MODULE=/usr/lib/softhsm/libsofthsm2.so"
            echo "PKCS11_TOKEN_LABEL=identity-kit"
            echo "PKCS11_PIN=1234"
          } >> "$GITHUB_ENV"
      - run: cargo llvm-cov --all-features --locked --codecov --output-path codecov.json
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: codecov.json
          disable_search: true
          fail_ci_if_error: true
          # PRs from forks get no OIDC token; Codecov accepts those uploads without one.
          use_oidc: ${{ !github.event.pull_request.head.repo.fork }}
