name: Release-plz

on:
  push:
    branches: [main]
  # Attaches the crate and its provenance to an existing release, when that step failed after
  # publishing: a rerun would not repeat it, since release-plz finds nothing left to release.
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing release tag to attach the crate and provenance to, e.g. v0.2.0"
        required: true
        type: string

permissions: {}

jobs:
  # Publish to crates.io, tag and create a GitHub release once the release PR is merged.
  release:
    name: Release
    if: github.repository_owner == 'impierce'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # crates.io trusted publishing.
      id-token: write
    outputs:
      tag: ${{ steps.crates.outputs.tag }}
      hashes: ${{ steps.crates.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # An App token (unlike GITHUB_TOKEN) lets the created tags and releases trigger other workflows.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - id: release-plz
        if: github.event_name == 'push'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      # Attach each released `.crate` to its GitHub release, exactly as crates.io serves it: the
      # download must match the checksum in the crates.io index. The provenance job signs these
      # files, so anyone can check that a crate came from this workflow.
      - id: crates
        if: steps.release-plz.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Started by hand for an existing release: `identity-kit` is the only released package.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::tag must look like v1.2.3, not $TAG"
              exit 1
            fi
            RELEASES=$(jq -nc --arg version "${BASH_REMATCH[1]}" --arg tag "$TAG" \
              '[{package_name: "identity-kit", version: $version, tag: $tag}]')
          fi
          mkdir crates
          # The sparse index path of a crate name (https://doc.rust-lang.org/cargo/reference/registry-index.html#index-files).
          index_path() {
            local name="${1,,}"
            case ${#name} in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          while read -r name version tag; do
            file="crates/$name-$version.crate"
            # The index and the CDN can lag a few minutes behind the upload.
            for attempt in $(seq 1 30); do
              expected=$(curl -fsSL "https://index.crates.io/$(index_path "$name")" \
                | jq -r --arg v "$version" 'select(.vers == $v) | .cksum' || true)
              if [ -n "$expected" ] \
                && curl -fsSL -o "$file" "https://static.crates.io/crates/$name/$name-$version.crate" \
                && echo "$expected  $file" | sha256sum --check --status; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                echo "::error::$name $version is not on crates.io with the indexed checksum"
                exit 1
              fi
              sleep 20
            done
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          done < <(jq -r '.[] | "\(.package_name) \(.version) \(.tag)"' <<< "$RELEASES")
          echo "hashes=$(cd crates && sha256sum -- *.crate | base64 -w0)" >> "$GITHUB_OUTPUT"

  # SLSA build level 3 provenance for the released crates, signed through Sigstore and attached to
  # the GitHub release as `<file>.intoto.jsonl`; `slsa-verifier` checks it (docs/RELEASE.md).
  # Only one package is released, so its tag is the release the provenance goes to.
  provenance:
    name: Provenance
    needs: release
    if: needs.release.outputs.hashes != ''
    permissions:
      # Read the workflow run the provenance describes.
      actions: read
      # Sign the provenance with the workflow's identity.
      id-token: write
      # Upload it to the GitHub release.
      contents: write
    # The generator must be referenced by tag, not by commit: the provenance names the builder by
    # its tag, which `slsa-verifier` checks.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag }}

  # Open or update the release PR with the next version and changelog.
  release-pr:
    name: Release PR
    if: github.repository_owner == 'impierce' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # An App token (unlike GITHUB_TOKEN) lets the release PR trigger QA.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
