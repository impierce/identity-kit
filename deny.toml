# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# `advisories` runs in the Audit workflow; `licenses`, `bans` and `sources` run in the License workflow.

[graph]
all-features = true

[advisories]
# Also fail on unmaintained crates anywhere in the graph and on yanked versions.
unmaintained = "all"
yanked = "deny"
# Keep in step with `osv-scanner.toml`, which OpenSSF Scorecard reads.
ignore = [
    # Marvin attack: timing side channel in `rsa` private-key operations, no fixed version.
    # This crate uses `rsa` for public-key verification only; see docs/adr/0001-rsa-verification-only.md.
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for signature verification only; no private-key operations" },
    # Timing side channels in `crypto-bigint` < 0.7.6. The library is on 0.7.6; what is left is
    # 0.5.5, which no 0.5 release fixes, reached only through the `jsonwebtoken` dev-dependency
    # (`rust_crypto`) that tests use to cross-check verification with public test keys.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 is a dev-dependency only, verifying with public test keys" },
]

[licenses]
# Permissive licenses compatible with distributing this crate under Apache-2.0.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Mozilla root store data (`webpki-root-certs`), a permissive data license.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# Keep the list above as policy, even for licenses no dependency currently uses.
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
