[package]
name = "identity-kit"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "DID, key management and verifiable credential primitives"
license = "Apache-2.0"
repository = "https://github.com/impierce/identity-kit"
keywords = ["did", "ssi", "digital-credentials", "vc"]
categories = ["cryptography", "authentication"]
include = ["/src", "/CHANGELOG.md", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["secp256k1", "software", "did-key", "did-jwk", "did-web", "reqwest", "vc", "sd-jwt", "domain-linkage"]
# ES256K signatures and `secp256k1` keys, via `k256`.
secp256k1 = ["dep:k256"]
# RS256 and PS256 signatures, via `rsa`.
rsa = ["dep:rsa"]
# `InMemoryKeyStore`: a key store for tests and development, with an optional deterministic seed.
in-memory = ["dep:getrandom"]
# `SoftwareKeyStore`: a key store over a private JWK set file.
software = ["dep:getrandom"]
# `keys::testsuite`, the behavioural suite every key store must pass.
test-vectors = []
# The `did:key` method (`methods::key`).
did-key = []
# The `did:jwk` method (`methods::jwk`).
did-jwk = []
# The `did:web` method (`methods::web`) over an injected `HttpClient`.
did-web = ["dep:url"]
# The hardened default `HttpClient` for `did:web`, via `reqwest` with `rustls` and `ring`.
reqwest = ["did-web", "dep:reqwest", "dep:rustls", "dep:tokio"]
# Verifiable credentials and presentations as JWTs (`vc`), via `chrono` for timestamps.
vc = ["dep:chrono"]
# SD-JWT (RFC 9901) and SD-JWT VC (`sd_jwt_vc`): `getrandom` for salts, `miniz_oxide` for status lists.
sd-jwt = ["vc", "dep:getrandom", "dep:miniz_oxide"]
# DIF Well Known DID Configuration (`domain_linkage`), over the `vc` module and `did:web`'s `url`.
domain-linkage = ["vc", "did-web"]

[dependencies]
async-trait = "0.1"
base64 = { version = "0.22", default-features = false, features = ["std"] }
bs58 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["now", "serde", "std"], optional = true }
ed25519-dalek = { version = "3.0", features = ["pkcs8"] }
getrandom = { version = "0.4", features = ["std"], optional = true }
indexmap = { version = "2.0", features = ["serde"] }
jsonwebtoken = { version = "10.3", default-features = false }
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"], optional = true }
miniz_oxide = { version = "0.9", optional = true }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"], optional = true }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "sha2", "std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.0", features = ["net"], optional = true }
url = { version = "2.5", optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
proptest = "1.0"
tempfile = "3.0"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }

[workspace]
members = ["xtask"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
