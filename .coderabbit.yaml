# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit configuration: https://docs.coderabbit.ai/reference/configuration
reviews:
  path_filters:
    # Lock files are generated.
    - "!**/*.lock"
    # Specification test vectors are verbatim copies of the specifications' examples (W3C, IETF,
    # DIF); they are not code to review and would push pull requests over the file limit.
    - "!tests/vectors/**"
    - "!fuzz/seeds/**"
